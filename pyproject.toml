[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ussdkit"
version = "0.1.0"
description = "Stateful USSD & GSM session emulator, 3GPP TS 23.038 GSM-7/UCS-2 byte-budget guard, menu-tree crawler, and telco chaos testing suite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "ussd",
    "gsm-7",
    "ucs-2",
    "telecom",
    "fintech",
    "mobile-money",
    "africastalking",
    "hubtel",
    "infobip",
    "testing",
    "chaos-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Communications :: Telephony",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
ussdkit = "ussdkit.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/ussdkit"
Repository = "https://github.com/codesphere-u/ussdkit"
Issues = "https://github.com/codesphere-u/ussdkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ussdkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ussdkit"]
